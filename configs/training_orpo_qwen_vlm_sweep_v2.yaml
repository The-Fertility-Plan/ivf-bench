# VLM ORPO Sweep V2 — fixes to the first VLM sweep:
#
# 1. lora_r=16, lora_alpha=32 (Unsloth + Thinking Machines consensus, α/r=2 ratio)
#    — first sweep used r=8/α=36 carried over from tributo; high-LR trials
#      were winning likely because LoRA capacity was undersized.
#
# 2. lora_dropout=0 (Unsloth recommendation)
#
# 3. Sort sweep on eval_rewards/accuracies (maximize), not eval_loss (minimize)
#    — eval_loss is dominated by the per-token-summed log-odds term and rewards
#      trials that aggressively push margins at the cost of NLL. Accuracies is
#      the actual preference-learning signal we care about.
#
# 4. LR sweep range pulled DOWN to 5e-5 → 5e-4 (was 5e-5 → 1e-3) — with r=16
#    we expect the optimum to settle in the canonical 1e-4 to 2e-4 band
#    (Thinking Machines: ~10× FullFT lr).
#
# Same 8 trials × 1 epoch, constant LR, dataset (clipped).

task: llm-orpo
base_model: Qwen/Qwen3.5-9B
project_name: ivf-bench-qwen9b-vlm-orpo-sweep   # SAME as v1 — for side-by-side comparison in the same wandb project
log: wandb
backend: local

data:
  path: monostate/ivf-bench-orpo-qwen9b-clipped
  train_split: train
  valid_split: eval
  chat_template: tokenizer
  column_mapping:
    text_column: chosen
    rejected_text_column: rejected
    prompt_text_column: prompt
    image_column: images

params:
  # Fixed
  epochs: 1
  batch_size: 1
  gradient_accumulation: 8
  optimizer: adamw_torch
  scheduler: constant
  warmup_ratio: 0
  block_size: 6144
  model_max_length: 6144
  max_prompt_length: 1024
  max_completion_length: 5120
  peft: true
  target_modules: all-linear
  lora_r: 16         # was 8
  lora_alpha: 32     # was 36; α/r=2 (TM convention)
  lora_dropout: 0    # was 0.05; Unsloth recommendation
  mixed_precision: bf16
  attn_implementation: sdpa
  padding: right
  save_strategy: epoch
  eval_strategy: epoch
  save_total_limit: 1
  logging_steps: 5
  seed: 42

  # Sweep
  use_sweep: true
  sweep_backend: optuna
  sweep_n_trials: 8
  sweep_metric: eval_rewards/accuracies   # was eval_loss
  sweep_direction: maximize               # was minimize
  wandb_sweep: true

  # Tighter LR range — expect canonical 1e-4..2e-4 to win with r=16
  sweep_params: '{"lr": {"type": "loguniform", "low": 5e-5, "high": 5e-4}, "dpo_beta": {"type": "uniform", "low": 0.05, "high": 0.3}}'

  # Defaults (overridden per-trial)
  lr: 1e-4
  dpo_beta: 0.1
