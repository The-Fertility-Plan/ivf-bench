# VLM ORPO FINAL Training Config for Qwen 3.5-9B on IVF-Bench
# Run on Lambda 2x H100 80GB AFTER sweep completes:
#   aitraining --config training_orpo_qwen_vlm_final.yaml
#
# Fill in `lr` and `dpo_beta` with the BEST values from the sweep before running.
# Sweep finds these via training_orpo_qwen_vlm_sweep.yaml (1 epoch per trial);
# this config does the real production training (3 epochs) with the winners.

task: llm-orpo
base_model: Qwen/Qwen3.5-9B
project_name: ivf-bench-qwen9b-vlm-orpo-final   # NEW project — true VLM production training
log: wandb
backend: local

data:
  path: monostate/ivf-bench-orpo-qwen9b-clipped
  train_split: train
  valid_split: eval
  chat_template: tokenizer
  column_mapping:
    text_column: chosen
    rejected_text_column: rejected
    prompt_text_column: prompt
    image_column: images

params:
  # ---- Hyperparameters (from VLM V1 sweep best) ----
  # V1 VLM sweep: 8 trials × 1 epoch, constant LR, no warmup, r=8, α=36
  # Winner: lr=7.58e-4, dpo_beta=0.222 → 1-epoch auto-retrain hit
  # acc=0.98, nll=1.51, margins=+937 (the strongest 1-epoch result we have)
  lr: 0.0007584284606582496
  dpo_beta: 0.22156160214807286

  # ---- Production training schedule ----
  epochs: 3
  batch_size: 1
  gradient_accumulation: 8
  optimizer: adamw_torch
  scheduler: cosine
  warmup_ratio: 0.1
  seed: 42

  # ---- Sequence sizing (matches sweep, fits in 80 GB H100 budget) ----
  block_size: 6144
  model_max_length: 6144
  max_prompt_length: 1024
  max_completion_length: 5120

  # ---- LoRA ----
  peft: true
  target_modules: all-linear
  lora_r: 8
  lora_alpha: 36
  lora_dropout: 0.05

  # ---- Precision + attention ----
  mixed_precision: bf16
  attn_implementation: sdpa
  padding: right

  # ---- Checkpointing ----
  save_strategy: epoch
  eval_strategy: epoch
  save_total_limit: 2   # keep best + last
  logging_steps: 5
